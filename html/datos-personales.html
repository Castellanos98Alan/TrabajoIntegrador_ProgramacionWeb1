<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Usuario - Datos Personales</title>
  <link rel="stylesheet" href="../css/estilos-datos-personales.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Header principal -->
  <header id="encabezado-principal">
   <a href="/index.html" id="encabezado-principal-logo">
      <img src="../assets/img/LogoRosaFluor.png" alt="Logo VideoGames">
    </a>

    <div id="encabezado-principal-buscador">
      <input type="search" name="q" placeholder="Buscar videojuegos, géneros, autores...">
      <img src="../assets/img/LupaRosa.png" alt="Buscar">
    </div>

      <a href="/html/login.html" title="Mi Perfil">
         <img src="/assets/img/login_24dp_FF1491_FILL0_wght400_GRAD0_opsz24.png" alt="Icono de Perfil" class="img-login">
      </a>
  </header>
  <!-- Bloque Mi usuario -->
  <main class="contenedores">
    <div class="contenedor">
      <nav class="breadcrumb">
        <a href="#">Mi cuenta</a> &gt; <span>Mi usuario</span>
      </nav>

      <h2>Mi usuario</h2>

      <form class="formulario">
        <label for="email">Email principal</label>
        <input type="email" id="email" name="email" placeholder="@gmail.com" required class="input-email">
        <button type="submit" class="boton">Guardar cambios</button>

        <div class="fila">
          <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" minlength="6" disabled value="******">
          </div>
          <button type="button" class="boton-secundario">CAMBIAR</button>
        </div>
      </form>
    </div>

    <!-- Bloque Datos personales -->
    <div class="contenedor">
      <nav class="breadcrumb">
        <a href="#">Mi cuenta</a> &gt; <span>Datos Personales</span>
      </nav>

      <h2>Datos personales</h2>

      <form class="formulario">
        <div class="fila">
          <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>
          </div>
          <div>
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" required>
          </div>
        </div>

        <div class="fila">
          <div>
            <label for="tipo">Tipo</label>
            <select id="tipo" name="tipo" required>
              <option value="" style="color:rgb(105, 105, 105)" disabled selected>Seleccione...</option>
              <option value="dni" style="color:black">DNI</option>
              <option value="pasaporte" style="color:black">Pasaporte</option>
              <option value="lc" style="color:black">Libreta Cívica</option>
            </select>
          </div>
          <div>
            <label for="documento">Número de documento</label>
            <input type="number" id="documento" name="documento" min="1000000" max="99999999" required>
          </div>
          <div>
            <label for="fecha">Fecha de nacimiento</label>
            <input type="date" id="fecha" name="fecha" required>
          </div>
        </div>

        <div class="fila">
          <div>
            <label for="telefono">Teléfono celular</label>
            <input type="tel" id="telefono" name="telefono" pattern="[0-9]{10}" placeholder="Ej: 1122334455" required>
          </div>
          <div>
            <label for="email-sec">Email secundario</label>
            <input type="email" id="email-sec" name="email-sec">
          </div>
        </div>

        <button type="submit" class="boton">Guardar cambios</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-contenido">
      <div class="footer-logo">
        <img src="/assets/img/LogoRosaFluor.png" alt="Logo VideoGames">
        <h3>VIDEO GAMES</h3>
      </div>

      <div class="footer-links">
        <a href="#">Inicio</a>
        <a href="#">Términos</a>
        <a href="#">Privacidad</a>
        <a href="#">Soporte</a>
        <a href="#">Contacto</a>
      </div>

      <div class="footer-redes">
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-tiktok"></i></a>
      </div>
    </div>

    <p class="footer-copy">&copy; 2025 VideoGames. Todos los derechos reservados.</p>
  </footer>
  <script src="https://kit.fontawesome.com/a2d9d5c5f1.js" crossorigin="anonymous"></script>

  <script src="../js/validacion-datos-personales.js"></script>

</body>

</html>
