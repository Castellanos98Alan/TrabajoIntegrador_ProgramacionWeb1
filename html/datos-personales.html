<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Usuario - Datos Personales</title>

  <link rel="stylesheet" href="../css/estilos-datos-personales.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Header principal -->
  <header id="encabezado-principal">
    <a href="/index.html" id="encabezado-principal-logo">
      <img src="../assets/img/LogoRosaFluor.png" alt="Logo VideoGames">
    </a>

    <div id="encabezado-principal-buscador">
      <input type="search" name="q" placeholder="Buscar videojuegos, géneros, autores...">
      <img src="../assets/img/LupaRosa.png" alt="Buscar">
    </div>

    <a href="/html/login.html" title="Mi Perfil">
      <img src="/assets/img/login_24dp_FF1491_FILL0_wght400_GRAD0_opsz24.png" alt="Icono de Perfil" class="img-login">
    </a>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="contenedor-principal">

    <!-- MI USUARIO -->
    <section class="card">
      <h2>Mi usuario</h2>

      <form id="form-usuario" class="formulario">
        <label>Email principal</label>
        <input type="email" id="email-principal" class="input-text" placeholder="@gmail.com" required>



        <div class="fila">
          <div>
            <label>Contraseña</label>
            <input type="password" id="password" class="input-text" placeholder="********" required>
            <button id="btn-usuario" class="btn" disabled>GUARDAR CAMBIOS</button>
          </div>

          <button type="button" class="btn-secundario btn-mostrar">Mostrar Contraseña</button>
        </div>

      </form>
    </section>

    <!-- DATOS PERSONALES -->
    <section class="card">
      <h2>Datos personales</h2>

      <form id="form-datos" class="formulario">

        <div class="fila">
          <div>
            <label>Nombre</label>
            <input type="text" id="nombre" required class="input-text" placeholder="Nombre">
          </div>
          <div>
            <label>Apellido</label>
            <input type="text" id="apellido" required class="input-text" placeholder="Apellido">
          </div>
        </div>

        <div class="fila">
          <div>
            <label>Tipo</label>
            <select id="tipo" required class="input-text">
              <option value="" disabled selected>Seleccione...</option>
              <option value="DNI">DNI</option>
              <option value="CI">CI</option>
              <option value="PASAPORTE">PASAPORTE</option>
            </select>
          </div>
          <div>
            <label>Número de documento</label>
            <input type="text" id="documento" required class="input-text" placeholder="Documento">
          </div>
          <div>
            <label>Fecha de nacimiento</label>
            <input type="date" id="fecha" required class="input-text" >
          </div>
        </div>

        <div class="fila">
          <div>
            <label>Teléfono celular</label>
            <input type="text" id="telefono" required class="input-text" placeholder="Teléfono celular">
          </div>
          <div>
            <label>Email secundario</label>
            <input type="email" id="email-sec" class="input-text" placeholder="email secundario">
          </div>
        </div>

        <button id="btn-datos" class="btn" disabled>GUARDAR CAMBIOS</button>
      </form>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-contenido">
      <div class="footer-logo">
        <img src="/assets/img/LogoRosaFluor.png" alt="Logo VideoGames">
        <h3>VIDEO GAMES</h3>
      </div>

      <div class="footer-links">
        <a href="#">Inicio</a>
        <a href="#">Términos</a>
        <a href="#">Privacidad</a>
        <a href="#">Soporte</a>
        <a href="#">Contacto</a>
      </div>

      <div class="footer-redes">
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-tiktok"></i></a>
      </div>
    </div>

    <p class="footer-copy">&copy; 2025 VideoGames. Todos los derechos reservados.</p>
  </footer>

  <script src="https://kit.fontawesome.com/a2d9d5c5f1.js" crossorigin="anonymous"></script>
  <script src="../js/validacion-datos-personales.js"></script>

</body>

</html>
