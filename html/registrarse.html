<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8">
   <title>Formulario - Registrarse</title>
   <link rel="stylesheet" href="../css/estilos-registrarse.css">
   <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
   <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet">
   <script src="https://kit.fontawesome.com/a2b5d5e0b8.js" crossorigin="anonymous"></script>
</head>

<body>
   <!-- Header principal -->
   <header id="encabezado-principal">
      <a href="index.html" id="encabezado-principal-logo">
         <img src="../assets/img/LogoRosaFluor.png" alt="Logo VideoGames">
      </a>

      <div id="encabezado-principal-buscador">
         <input type="search" name="q" placeholder="Buscar videojuegos, géneros, autores...">
         <img src="../assets/img/LupaRosa.png" alt="Buscar">
      </div>

      <a href="/perfil" title="Mi Perfil">
         <img src="../assets/img/menu-rosa.png" alt="Icono de Perfil">
      </a>
   </header>

   <!-- Contenido principal -->
   <main class="registrarse">
      <div class="register-box">
         <h2 class="registrate">Registrarse</h2>
         <form>
            <input type="email" placeholder="Email*" required>

            <div class="password-container">
               <input type="password" placeholder="Contraseña*" required>
            </div>

            <br><br>

            <button type="submit">REGISTRATE</button>

            <p class="login">¿Ya tenés cuenta? <a href="login.html">Iniciar Sesión</a></p>

            <p class="terms">
               Al continuar, confirmo que he leído y aceptado los
               <a href="#">Términos y Condiciones y las Políticas de Privacidad</a>.
            </p>
         </form>
      </div>
   </main>

   <!-- Footer -->
   <footer class="footer">
      <div class="footer-contenido">
         <div class="footer-logo">
            <img src="../assets/img/LogoRosaFluor.png" alt="Logo VideoGames">
            <h3>VIDEO GAMES</h3>
         </div>

         <div class="footer-links">
            <a href="#">Inicio</a>
            <a href="#">Términos</a>
            <a href="#">Privacidad</a>
            <a href="#">Soporte</a>
            <a href="#">Contacto</a>
         </div>

         <div class="footer-redes">
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-tiktok"></i></a>
         </div>
      </div>

      <p class="footer-copy">&copy; 2025 VideoGames. Todos los derechos reservados.</p>
   </footer>

   <script src="../js/validacion-registrarse.js"></script>

</body>

</html>
