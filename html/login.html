<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión | VideoGames</title>

  <!-- Estilos -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../css/temas-colores-fuentes.css">
  <link rel="stylesheet" href="../css/estilos-principal.css">
  <link rel="stylesheet" href="../css/estilos-login.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <!-- Header principal -->
  <header id="encabezado-principal">
    <a href="index.html" id="encabezado-principal-logo">
      <img src="../assets/img/LogoRosaFluor.png" alt="Logo VideoGames">
    </a>

    <div id="encabezado-principal-buscador">
      <input type="search" name="q" placeholder="Buscar videojuegos, géneros, autores...">
      <img src="../assets/img/LupaRosa.png" alt="Buscar">
    </div>

    <a href="/perfil" title="Mi Perfil">
      <img src="../assets/img/menu-rosa.png" alt="Icono de Perfil">
    </a>
  </header>

  <!-- Contenido principal -->
  <main class="area-login">
    <div class="login-box">
      <h2 class="iniciarSesion">Iniciar sesión</h2>
      <form>
        <input type="email" placeholder="Email*" required>

        <div class="password-container">
          <input type="password" placeholder="Contraseña*" required>
        </div>

        <a href="recuperar-password.html">¿Olvidaste tu contraseña?</a>
        <button type="submit">INICIAR SESIÓN</button>

        <p class="register">
          ¿No tenés cuenta? <a href="registrarse.html">Registrate</a>
        </p>

        <p class="terms">
          Al continuar, confirmo que he leído y aceptado los
          <a href="#">Términos y Condiciones y las Políticas de Privacidad</a>.
        </p>
      </form>
    </div>
  </main>
  <!-- Footer -->
  <footer class="footer">
    <div class="footer-contenido">
      <div class="footer-logo">
        <img src="/assets/img/LogoRosaFluor.png" alt="Logo VideoGames">
        <h3>VIDEO GAMES</h3>
      </div>

      <div class="footer-links">
        <a href="#">Inicio</a>
        <a href="#">Términos</a>
        <a href="#">Privacidad</a>
        <a href="#">Soporte</a>
        <a href="#">Contacto</a>
      </div>

      <div class="footer-redes">
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-tiktok"></i></a>
      </div>
    </div>

    <p class="footer-copy">&copy; 2025 VideoGames. Todos los derechos reservados.</p>
  </footer>

<script src="../js/validacion-login.js"></script>

</body>

</html>
